site_name: Catálogo Sage50BI
site_url: https://plantillas.sage50eia.com/
repo_url: https://github.com/wertyMSD/repositorio_Sage50bi
repo_name: repositorio_Sage50bi
copyright: 'Copyright &copy; Sage50BI'

# Configuración de tema Material
theme:
  name: material
  language: es
  locale: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.footnote.tooltips
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Space Mono

# Extensiones de Markdown
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: [es, ca]
  - rss:
      match_path: plantillas/*.md
      feed_title: Plantillas Sage50BI — Novedades
      feed_description: Últimas plantillas gratuitas para Sage50BI
      image: img/og-default.png
      categories: [plantillas]
  - git-revision-date-localized:
      enabled: true
      type: date
      locale: es
      fallback_to_build_date: true
  - minify:
      minify_html: true

# Configuración de navegación (se genera automáticamente)
nav:
  - Inicio: index.md
  - Plantillas:
      - Informes y Listados: categorias/informes-listados.md
      - Facturas y Documentos: categorias/facturas-documentos.md
      - Balances y Contabilidad: categorias/balances-contabilidad.md
      - Dashboard y Gráficos: categorias/dashboards-graficos.md
  - Packs:
      - Gestión Comercial: packs/pack-gestion-comercial.md
      - Contabilidad Completa: packs/pack-contabilidad-completa.md
  - Cómo se carga en Sage50BI: como-cargar.md

# Extra CSS y JavaScript
extra_css:
  - stylesheets/sage50bi-portal.css
extra_javascript:
  - js/extra.js

# Configuración de i18n (mkdocs-static-i18n)
i18n:
  default_language: es
  languages:
    es: Español
    ca: Català
  nav_translations:
    es:
      Inicio: Inicio
      Plantillas: Plantillas
      Packs: Packs
      Cómo se carga en Sage50BI: Cómo se carga en Sage50BI
    ca:
      Inicio: Inici
      Plantillas: Plantilles
      Packs: Paquets
      Cómo se carga en Sage50BI: Com es carrega a Sage50BI

# Validación estricta (opcional, para CI)
strict: false
