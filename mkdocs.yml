site_name: Catálogo S50bi
site_url: https://plantillas.alfonsoautomatiza.com/
site_description: 'Catálogo de plantillas gratuitas para S50bi'
repo_url: https://github.com/alfonsoautomatiza/repositorio_Plantillas_SA50bi
repo_name: repositorio_Plantillas_SA50bi
copyright: 'Copyright &copy; S50bi'

# Configuración de tema Material
theme:
  name: material
  custom_dir: docs/overrides
  language: es
  locale: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.footnote.tooltips
  icon:
    repo: fontawesome/brands/github
  font: false

# Extensiones de Markdown
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
          nav_translations:
            Inicio: Inicio
            Plantillas: Plantillas
            Packs: Packs
            Cómo instalar plantillas en S50bi: Cómo instalar plantillas en S50bi
        - locale: ca
          name: Català
          build: true
          site_name: Catàleg S50bi
          site_description: 'Catàleg de plantilles gratuïtes per a S50bi'
          nav_translations:
            Inicio: Inici
            Plantillas: Plantilles
            Packs: Paquets
            Cómo instalar plantillas en S50bi: Com instal·lar plantilles a S50bi
  - search:
      lang: es
  - social
  - optimize:
      optimize_png: false
  - rss:
      match_path: plantillas/*.md
      feed_title: Plantillas S50bi — Novedades
      feed_description: Últimas plantillas gratuitas para S50bi
      image: img/og-default.png
      categories: [plantillas]
  - git-revision-date-localized:
      enabled: true
      type: date
      locale: es
      fallback_to_build_date: true
  - minify:
      minify_html: true

# Configuración de navegación (se genera automáticamente)
nav:
  - Inicio: index.md
  - Plantillas:
      - Informes y Listados: categorias/informes-listados.md
      - Facturas y Documentos: categorias/facturas-documentos.md
      - Balances y Contabilidad: categorias/balances-contabilidad.md
      - Dashboard y Gráficos: categorias/dashboards-graficos.md
      - CRM SSM: categorias/crm-ssm.md
  - Packs:
      - Gestión Comercial: packs/pack-gestion-comercial.md
      - Contabilidad Completa: packs/pack-contabilidad-completa.md
  - Cómo instalar plantillas en S50bi: como-cargar.md

# Extra CSS
extra_css:
  - stylesheets/sage50bi-portal.css

# Never publish customer documentation, even if stale files remain in docs/
exclude_docs: privadas/

# Validación estricta (opcional, para CI)
strict: false
