site_name: Plantillas Sage50BI
site_description: Catálogo de plantillas SQL gratuitas para Sage50BI — ALCA TIC
site_url: https://wertymsd.github.io/repositorio_Sage50bi/
site_author: ALCA TIC, S.L.

repo_url: https://github.com/wertyMSD/repositorio_Sage50bi
repo_name: wertyMSD/repositorio_Sage50bi

copyright: © 2026 ALCA TIC, S.L.

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo oscuro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo claro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a sistema

extra_css:
  - css/extra.css

plugins:
  - search:
      lang: es
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://pedironline.com
      name: ALCA TIC
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/
      name: YouTube
    - icon: fontawesome/brands/github
      link: https://github.com/wertyMSD/repositorio_Sage50bi
      name: GitHub

nav:
  - Inicio: index.md
  - Categorías:
    - Informes y Listados: categorias/informes-listados.md
    - Facturas y Documentos: categorias/facturas-documentos.md
    - Balances y Contabilidad: categorias/balances-contabilidad.md
    - Dashboard y Gráficos: categorias/dashboards-graficos.md
  - Packs: packs/
  - Plantillas: plantillas/
